<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Live Game Tracker</title>
    <style>
        .status-hot{margin-bottom:8px}

        :root {
            color-scheme: dark
        }

        body {
            margin: 0;
            background: #0b0f14;
            color: #eef2f7;
            font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 32px 22px 48px
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            margin-bottom: 30px
        }

        .eyebrow {
            color: #7f8da0;
            text-transform: uppercase;
            letter-spacing: .12em;
            font-size: 12px
        }

        .sub {
            color: #91a0b1
        }

        .grid {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px
        }

        .game {
            display: block;
            text-decoration: none;
            color: inherit;
            background: #111821;
            border: 1px solid #202b36;
            border-radius: 16px;
            padding: 22px;
            transition: .15s
        }

        .game:hover {
            border-color: #526274;
            transform: translateY(-2px)
        }

        .game h2 {
            margin: 0 0 16px;
            font-size: 24px
        }

        .hot {
            font-size: 11px;
            color: #ffb45e;
            text-transform: uppercase;
            letter-spacing: .1em
        }

        .hero {
            font-size: 34px;
            font-weight: 700
        }

        .label {
            color: #91a0b1;
            font-size: 12px;
            margin-top: 5px
        }

        .stats {
            display: grid;
            grid-template-columns:1fr 1fr;
            gap: 14px;
            margin: 20px 0
        }

        .stat {
            background: #0c1219;
            border-radius: 10px;
            padding: 12px
        }

        .platforms {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            color: #aeb9c7;
            font-size: 12px
        }

        .platforms span {
            border: 1px solid #263341;
            border-radius: 999px;
            padding: 5px 8px
        }

        .top {
            border-top: 1px solid #202b36;
            margin-top: 18px;
            padding-top: 14px;
            color: #cbd5e1;
            font-size: 13px
        }

        @media (max-width: 600px) {
            main {
                padding: 22px 14px
            }

            .hero {
                font-size: 28px
            }

            header {
                align-items: flex-start;
                flex-direction: column
            }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <div class="eyebrow">Live streaming tracker</div>
            <h1>Games</h1>
            <div class="sub">See what's hot, then open a game's full dashboard.</div>
        </div>
        <div id="updated" class="sub">Loading…</div>
    </header>
    <section id="games" class="grid" aria-live="polite"></section>
</main>
<script>
    const fmt = n => Number(n || 0).toLocaleString('en-IN');

    async function load() {
        const root = document.getElementById('games');
        try {
            const games = await fetch('/api/games').then(r => {
                if (!r.ok) throw new Error('API ' + r.status);
                return r.json()
            });
            root.innerHTML = games.map(
                g => `<a class="game" href="/game.html?game=${
                    encodeURIComponent(g.id)
                }"><div class="hot status-hot">${
                    g.active === true && Number(g.liveStreams || 0) > 0
                        ? '● Live now'
                        : '● Offline'
                }</div><h2>${esc(g.name)}</h2><div class="hero">${fmt(g.totalViewers)} <span class="label">viewers</span></div><div class="stats"><div class="stat"><strong>${fmt(g.liveStreams)}</strong><div class="label">live streams</div></div><div class="stat"><strong>${g.topChannel ? esc(g.topChannel) : '—'}</strong><div class="label">top streamer${g.topViewers ? ' · ' + fmt(g.topViewers) : ''}</div></div></div><div class="platforms"><span>YouTube ${fmt(g.youtubeStreams)}</span><span>Twitch ${fmt(g.twitchStreams)}</span><span>Kick ${fmt(g.kickStreams)}</span></div></a>`).join('') || '<div class="sub">No games configured.</div>';
            document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
        } catch (e) {
            root.innerHTML = '<div class="sub">Unable to load game data.</div>';
            document.getElementById('updated').textContent = 'Tracker unavailable';
            console.error(e)
        }
    }

    function esc(v) {
        return String(v ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[c]))
    }

    load();
    setInterval(load, 60000);
</script>
</body>
</html>
