<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esports Match</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0e13;color:#eef2f7;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}a{color:#dbeafe}.page{max-width:1450px;margin:auto;padding:28px 24px 60px}.back{color:#91a0b1;text-decoration:none;font-size:13px}.hero{margin-top:18px;padding:24px;border:1px solid #202b36;border-radius:16px;background:#111821}.hero-top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.hero h1{font-size:34px;margin:0 0 7px}.sub{color:#91a0b1;font-size:13px}.pill{padding:7px 10px;border:1px solid #294052;border-radius:999px;font-size:12px}.live{color:#52df9c}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}.metric{padding:15px;border:1px solid #263341;border-radius:11px;background:#0c1219}.metric .label{color:#91a0b1;font-size:12px}.metric .value{font-size:25px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px;border:1px solid #202b36;border-radius:14px;background:#111821}.panel h2{font-size:18px;margin:0 0 12px}.chart-wrap{height:330px}.platform-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.platform{padding:13px;border:1px solid #263341;border-radius:10px;background:#0c1219}.platform strong{font-size:20px}.stream-table-wrap{overflow-x:auto}.stream-table{width:100%;min-width:760px;border-collapse:collapse}.stream-table th,.stream-table td{padding:11px 10px;border-bottom:1px solid #202b36;text-align:left;vertical-align:top}.stream-table th{font-size:11px;color:#91a0b1;text-transform:uppercase;letter-spacing:.04em}.stream-table td.viewers{text-align:right;font-weight:800;white-space:nowrap}.stream-table .platform-cell{white-space:nowrap}.stream-table .channel-link{font-weight:800;text-decoration:none;color:#dbeafe}.stream-table .channel-link:hover{color:#36b9ff;text-decoration:underline}.stream-table .stream-link{font-size:12px}.stream-table .title-cell{color:#c1cbd7;line-height:1.4}.stream-table tr:hover{background:#0e161f}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.info div{padding:12px;border:1px solid #263341;border-radius:10px}.info span{display:block;color:#91a0b1;font-size:11px;margin-bottom:4px}.empty{color:#91a0b1;padding:15px 0}@media(max-width:900px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.page{padding:18px 12px}.hero h1{font-size:26px}.metrics,.platform-grid,.info{grid-template-columns:1fr}.chart-wrap{height:250px}}
</style>
</head><body><main class="page">
<a class="back" href="javascript:history.back()">← Back</a>
<section class="hero"><div class="hero-top"><div><h1 id="title">Loading match…</h1><div class="sub" id="tournament">—</div><div class="sub" id="time">—</div></div><div id="status" class="pill">Loading</div></div><div class="info"><div><span>Game</span><strong id="game">—</strong></div><div><span>Tier</span><strong id="tier">—</strong></div><div><span>Match ID</span><strong id="matchId">—</strong></div></div></section>
<section class="metrics"><div class="metric"><span class="label">Peak combined</span><div class="value" id="peak">—</div></div><div class="metric"><span class="label">Average combined</span><div class="value" id="average">—</div></div><div class="metric"><span class="label">Samples</span><div class="value" id="samples">—</div></div><div class="metric"><span class="label">Matched channels</span><div class="value" id="channels">—</div></div></section>
<div class="grid"><section class="panel"><h2>Combined & platform viewership</h2><div class="chart-wrap"><canvas id="trend"></canvas></div></section><section class="panel"><h2>Peak by platform</h2><div class="platform-grid" id="platformPeaks"></div><h2 style="margin-top:20px">Latest</h2><div class="platform-grid" id="latest"></div></section></div>
<section class="panel" style="margin-top:16px"><h2>Matched streams</h2><div id="streams" class="stream-table-wrap"><div class="empty">Loading…</div></div></section>
</main>
<script>
const qs=new URLSearchParams(location.search),matchId=qs.get('matchId')||'',game=qs.get('game')||'VALORANT';
const fmt=n=>Number(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){
 if(!matchId){document.getElementById('title').textContent='Match ID missing';return}
 try{
  const r=await fetch('/api/esports/matches/'+encodeURIComponent(matchId)+'?game='+encodeURIComponent(game));
  if(!r.ok)throw new Error(await r.text());
  const d=await r.json(),m=d.match||{},s=d.summary||{},latest=s.latest||{},peaks=s.peakByPlatform||{};
  document.title=(m.team1||'Match')+' vs '+(m.team2||'')+' · '+(m.game||game);
  document.getElementById('title').textContent=(m.team1||'TBD')+' vs '+(m.team2||'TBD');
  document.getElementById('tournament').textContent=(m.tournament||'Esports match')+' · '+(m.tier||'S/A');
  document.getElementById('time').textContent=(m.startTime?new Date(m.startTime).toLocaleString():'—')+' → '+(m.endTime?new Date(m.endTime).toLocaleString():'—');
  document.getElementById('status').textContent=d.active?'● LIVE':'COMPLETED';document.getElementById('status').className='pill '+(d.active?'live':'');
  document.getElementById('game').textContent=m.game||game;document.getElementById('tier').textContent=m.tier||'—';document.getElementById('matchId').textContent=m.matchId||matchId;
  document.getElementById('peak').textContent=fmt(s.peakCombined);document.getElementById('average').textContent=fmt(s.averageCombined);document.getElementById('samples').textContent=fmt(s.samples);
  const ch=Object.values(s.channelsByPlatform||{}).reduce((a,b)=>a+Number(b||0),0);document.getElementById('channels').textContent=fmt(ch);
  document.getElementById('platformPeaks').innerHTML=['YouTube','Twitch','Kick'].map(p=>`<div class="platform"><div class="sub">${p}</div><strong>${fmt(peaks[p])}</strong></div>`).join('');
  document.getElementById('latest').innerHTML=['YouTube','Twitch','Kick','Combined'].map(p=>{const k=p.toLowerCase();return `<div class="platform"><div class="sub">${p}</div><strong>${fmt(latest[k])}</strong></div>`}).join('');
  const rows=d.streams||[];
  document.getElementById('streams').innerHTML=rows.length?`<table class="stream-table"><thead><tr><th>Platform</th><th>Channel</th><th>Viewers</th><th>Title</th><th>Stream</th></tr></thead><tbody>${rows.map(x=>{const channel=x.channel||'Unknown channel';const channelHref='/channel.html?'+new URLSearchParams({name:channel,platform:x.platform||'',game:game}).toString();return `<tr><td class="platform-cell">${esc(x.platform||'Unknown')}</td><td><a class="channel-link" href="${channelHref}">${esc(channel)}</a></td><td class="viewers">${fmt(x.viewers)}</td><td class="title-cell">${esc(x.title||'Live stream')}</td><td>${x.url?`<a class="stream-link" href="${esc(x.url)}" target="_blank" rel="noopener">Open stream ↗</a>`:'—'}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No matched stream samples recorded for this match.</div>';
  const points=d.timeline||[],labels=points.map(x=>new Date(x.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
  new Chart(document.getElementById('trend'),{type:'line',data:{labels,datasets:[{label:'Combined',data:points.map(x=>x.combined),borderWidth:2,tension:.25,fill:true},{label:'YouTube',data:points.map(x=>x.youtube),borderWidth:1.5,tension:.25},{label:'Twitch',data:points.map(x=>x.twitch),borderWidth:1.5,tension:.25},{label:'Kick',data:points.map(x=>x.kick),borderWidth:1.5,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{x:{ticks:{color:'#91a0b1',maxTicksLimit:12},grid:{color:'#202b36'}},y:{beginAtZero:true,ticks:{color:'#91a0b1'},grid:{color:'#202b36'}}},plugins:{legend:{labels:{color:'#dbe4ef'}}}}});
 }catch(e){document.getElementById('title').textContent='Unable to load match';document.getElementById('streams').innerHTML='<div class="empty">'+esc(e.message||'Match unavailable')+'</div>';console.error(e)}
}
load();
</script></body></html>
