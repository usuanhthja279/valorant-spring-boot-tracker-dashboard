<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esports Match</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
html,body{width:100%;max-width:100%;overflow-x:hidden}
*{box-sizing:border-box}body{margin:0;background:#0b0e13;color:#eef2f7;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}a{color:#dbeafe}.back{color:#91a0b1;text-decoration:none;font-size:13px}.hero{margin-top:18px;padding:24px;border:1px solid #202b36;border-radius:16px;background:#111821}.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}.hero h1{font-size:34px;margin:0 0 7px}.sub{color:#91a0b1;font-size:13px}.match-title{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}.match-title-team{display:inline-flex;align-items:center;gap:9px;min-width:0}.match-title-team-name{white-space:nowrap}.match-title-vs{white-space:nowrap}.match-title-logo{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px;overflow:hidden}.match-title-logo img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.page{width:100%;max-width:1450px;margin:0 auto;padding:28px 24px 60px;min-width:0}.hero,.metrics,.grid,.panel,.scorebox{max-width:100%;min-width:0}.scoreline{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;justify-items:center;gap:14px;font-size:30px;font-weight:800;min-width:0}.scoreline .team-wrap{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-width:0}.scoreline .team-wrap:first-child{justify-content:flex-end}.scoreline .team-wrap:last-child{justify-content:flex-start}.scoreline .team-logo{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 42px;overflow:hidden}.scoreline .team-logo img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.scoreline .team{min-width:0;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scoreline .score{font-size:38px;white-space:nowrap;flex:0 0 auto}.status-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #294052;border-radius:999px;font-size:12px;white-space:nowrap}.status-dot{width:7px;height:7px;border-radius:50%;background:#f5b83d;display:inline-block}.status-pill.live{color:#52df9c;border-color:#275a48}.status-pill.live .status-dot{background:#52df9c}.status-pill.completed{color:#aeb9c7}.status-pill.completed .status-dot{background:#91a0b1}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}.metric{padding:15px;border:1px solid #263341;border-radius:11px;background:#0c1219}.metric .label{color:#91a0b1;font-size:12px}.metric .value{font-size:25px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px;border:1px solid #202b36;border-radius:14px;background:#111821}.panel h2{font-size:18px;margin:0 0 12px}.chart-wrap{height:330px}.platform-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.platform{padding:13px;border:1px solid #263341;border-radius:10px;background:#0c1219}.platform strong{font-size:20px}.stream-table-wrap{overflow-x:auto}.stream-table{width:100%;min-width:760px;border-collapse:collapse}.stream-table th,.stream-table td{padding:11px 10px;border-bottom:1px solid #202b36;text-align:left;vertical-align:top}.stream-table th{font-size:11px;color:#91a0b1;text-transform:uppercase;letter-spacing:.04em}.stream-table td.viewers{text-align:right;font-weight:800;white-space:nowrap}.stream-table .platform-cell{white-space:nowrap}.stream-table .channel-link{font-weight:800;text-decoration:none;color:#dbeafe}.stream-table .channel-link:hover{color:#36b9ff;text-decoration:underline}.stream-table .stream-link{font-size:12px}.stream-table .title-cell{color:#c1cbd7;line-height:1.4}.stream-table tr:hover{background:#0e161f}.stream-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.stream-controls input,.stream-controls select{background:#0c1219;color:#eef2f7;border:1px solid #263341;border-radius:8px;padding:9px 10px;font:inherit;font-size:13px}.stream-controls input{min-width:240px;flex:1}.stream-controls select{min-width:135px}.stream-count{color:#91a0b1;font-size:12px;margin-left:auto}.pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.pagination .page-info{color:#91a0b1;font-size:12px}.pagination button{background:#111821;color:#dbeafe;border:1px solid #294052;border-radius:8px;padding:8px 12px;cursor:pointer}.pagination button:disabled{opacity:.45;cursor:default}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.scorebox{margin-top:18px;padding:18px;border:1px solid #263341;border-radius:12px;background:#0c1219;text-align:center}.scoremeta{margin-top:7px;color:#91a0b1;font-size:12px}.info div{padding:12px;border:1px solid #263341;border-radius:10px}.info span{display:block;color:#91a0b1;font-size:11px;margin-bottom:4px}.empty{color:#91a0b1;padding:15px 0}@media(max-width:550px){.hero{padding:18px}.hero h1{font-size:25px}.scoreline{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;font-size:22px}.scoreline .team-logo{width:34px;height:34px;flex-basis:34px}.scoreline .team{max-width:90px}.scoreline .score{font-size:28px}}@media(max-width:900px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.page{padding:18px 12px}.hero h1{font-size:26px}.metrics,.platform-grid,.info{grid-template-columns:1fr}.chart-wrap{height:250px}}
</style>
</head><body><main class="page">
<a class="back" href="javascript:history.back()">← Back</a>
<section class="hero"><div class="hero-top"><div><h1 id="title" class="match-title"><span class="match-title-team"><span class="match-title-logo"><img id="titleTeam1Logo" alt="" loading="eager" referrerpolicy="no-referrer"></span><span class="match-title-team-name" id="titleTeam1">—</span></span><span class="match-title-vs">vs</span><span class="match-title-team"><span class="match-title-team-name" id="titleTeam2">—</span><span class="match-title-logo"><img id="titleTeam2Logo" alt="" loading="eager" referrerpolicy="no-referrer"></span></span></h1><div class="sub" id="tournament">—</div><div class="sub" id="time">—</div></div><div id="status" class="status-pill"><span class="status-dot"></span><span id="statusText">Loading</span></div></div><div class="scorebox"><div class="scoreline"><span class="team-wrap"><span class="team-logo"><img id="scoreTeam1Logo" alt="" loading="eager" referrerpolicy="no-referrer"></span><span class="team" id="scoreTeam1">—</span></span><span class="score" id="score">— : —</span><span class="team-wrap"><span class="team" id="scoreTeam2">—</span><span class="team-logo"><img id="scoreTeam2Logo" alt="" loading="eager" referrerpolicy="no-referrer"></span></span></div><div class="scoremeta" id="format">—</div></div><div class="info"><div><span>Game</span><strong id="game">—</strong></div><div><span>Tier</span><strong id="tier">—</strong></div><div><span>Match ID</span><strong id="matchId">—</strong></div></div></section>
<section class="metrics"><div class="metric"><span class="label">Peak combined</span><div class="value" id="peak">—</div></div><div class="metric"><span class="label">Average combined</span><div class="value" id="average">—</div></div><div class="metric"><span class="label">Samples</span><div class="value" id="samples">—</div></div><div class="metric"><span class="label">Matched channels</span><div class="value" id="channels">—</div></div></section>
<div class="grid"><section class="panel"><h2>Combined & platform viewership</h2><div class="chart-wrap"><canvas id="trend"></canvas></div></section><section class="panel"><h2>Peak by platform</h2><div class="platform-grid" id="platformPeaks"></div><h2 style="margin-top:20px">Latest</h2><div class="platform-grid" id="latest"></div></section></div>
<section class="panel" style="margin-top:16px">
<h2>Matched streams</h2>
<div class="stream-controls" aria-label="Matched stream filters">
  <input id="streamSearch" type="search" placeholder="Search channel, title or platform…" autocomplete="off">
  <select id="streamLiveFilter" aria-label="Filter matched streams by status">
    <option value="all">All streams</option>
    <option value="live">Live</option>
  </select>
  <select id="streamPlatformFilter" aria-label="Filter matched streams by platform">
    <option value="">All platforms</option>
    <option value="YouTube">YouTube</option>
    <option value="Twitch">Twitch</option>
    <option value="Kick">Kick</option>
  </select>
  <span class="stream-count" id="streamCount">—</span>
</div>
<div id="streams" class="stream-table-wrap"><div class="empty">Loading…</div></div>
<div class="pagination" id="streamPagination" hidden>
  <span class="page-info" id="streamPageInfo">Page 1 of 1</span>
  <div>
    <button type="button" id="streamPrev" disabled>Previous</button>
    <button type="button" id="streamNext" disabled>Next</button>
  </div>
</div>
</section>
</main>
<script>
const qs=new URLSearchParams(location.search),matchId=qs.get('matchId')||'',game=qs.get('game')||'VALORANT';
const fmt=n=>Number(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const normalizeTeamName=s=>String(s??'').trim().toLowerCase().replace(/\s+/g,' ');
const STREAMS_PER_PAGE=10;
let allMatchedStreams=[],filteredMatchedStreams=[],streamPage=1,matchData=null,teamLogos={};

function setLogo(id,url,name){
  const img=document.getElementById(id);
  if(!img)return;
  if(url){img.src=url;img.alt=(name||'Team')+' logo';}
  else{img.removeAttribute('src');img.alt='';}
}

async function loadTeamLogos(m){
  try{
    teamLogos=await fetch('/api/esports/team-logos?game='+encodeURIComponent(m?.game||game)).then(r=>r.ok?r.json():{});
  }catch(e){teamLogos={};}
  const t1=String(m?.team1||'').trim(),t2=String(m?.team2||'').trim();
  const lookup=(name)=>teamLogos[name]||teamLogos[normalizeTeamName(name)]||Object.entries(teamLogos).find(([k])=>normalizeTeamName(k)===normalizeTeamName(name))?.[1]||'';
  setLogo('titleTeam1Logo',lookup(t1),t1);
  setLogo('titleTeam2Logo',lookup(t2),t2);
  setLogo('scoreTeam1Logo',lookup(t1),t1);
  setLogo('scoreTeam2Logo',lookup(t2),t2);
}

function isStreamLive(x){
  if(x?.live===true)return true;
  if(x?.live===false)return false;
  const status=String(x?.status||'').toUpperCase();
  if(status==='LIVE')return true;
  if(status && status!=='LIVE')return false;
  return Boolean(matchData?.active);
}

function streamMatchesSearch(x,q){
  if(!q)return true;
  const hay=[x?.channel,x?.title,x?.platform].map(v=>String(v||'').toLowerCase()).join(' ');
  return hay.includes(q);
}

function rebuildPlatformFilter(){
  const select=document.getElementById('streamPlatformFilter');
  if(!select)return;
  const current=select.value;
  const platforms=[...new Set(allMatchedStreams.map(x=>String(x?.platform||'').trim()).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b));
  select.innerHTML='<option value="">All platforms</option>'+platforms.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
  if(platforms.includes(current))select.value=current;
}

function applyStreamFilters(resetPage=true){
  const q=String(document.getElementById('streamSearch')?.value||'').trim().toLowerCase();
  const liveOnly=document.getElementById('streamLiveFilter')?.value==='live';
  const platform=String(document.getElementById('streamPlatformFilter')?.value||'').trim().toLowerCase();
  filteredMatchedStreams=allMatchedStreams.filter(x=>{
    if(liveOnly&&!isStreamLive(x))return false;
    const streamPlatform=String(x?.platform||'').trim().toLowerCase();
    if(platform&&streamPlatform!==platform)return false;
    return streamMatchesSearch(x,q);
  });
  if(resetPage)streamPage=1;
  renderMatchedStreams();
}

function renderMatchedStreams(){
  const body=document.getElementById('streams');
  const count=document.getElementById('streamCount');
  const pagination=document.getElementById('streamPagination');
  const pageInfo=document.getElementById('streamPageInfo');
  const prev=document.getElementById('streamPrev');
  const next=document.getElementById('streamNext');
  const total=filteredMatchedStreams.length;
  const pages=Math.max(1,Math.ceil(total/STREAMS_PER_PAGE));
  streamPage=Math.min(Math.max(1,streamPage),pages);
  const from=(streamPage-1)*STREAMS_PER_PAGE;
  const rows=filteredMatchedStreams.slice(from,from+STREAMS_PER_PAGE);
  if(count)count.textContent=total+' stream'+(total===1?'':'s');
  if(!total){
    body.innerHTML='<div class="empty">No matched streams found for the selected filters.</div>';
  }else{
    body.innerHTML=`<table class="stream-table"><thead><tr><th>Platform</th><th>Channel</th><th>Viewers</th><th>Title</th><th>Stream</th></tr></thead><tbody>${rows.map(x=>{
      const channel=x.channel||'Unknown channel';
      const channelHref='/channel.html?'+new URLSearchParams({name:channel,platform:x.platform||'',game:game}).toString();
      return `<tr><td class="platform-cell">${esc(x.platform||'Unknown')}</td><td><a class="channel-link" href="${channelHref}">${esc(channel)}</a></td><td class="viewers">${fmt(x.viewers)}</td><td class="title-cell">${esc(x.title||'Live stream')}</td><td>${x.url?`<a class="stream-link" href="${esc(x.url)}" target="_blank" rel="noopener">Open stream ↗</a>`:'—'}</td></tr>`;
    }).join('')}</tbody></table>`;
  }
  if(pagination)pagination.hidden=total<=STREAMS_PER_PAGE;
  if(pageInfo)pageInfo.textContent=`Page ${streamPage} of ${pages}`;
  if(prev)prev.disabled=streamPage<=1;
  if(next)next.disabled=streamPage>=pages;
}

function wireStreamControls(){
  document.getElementById('streamSearch')?.addEventListener('input',()=>applyStreamFilters(true));
  document.getElementById('streamLiveFilter')?.addEventListener('change',()=>applyStreamFilters(true));
  document.getElementById('streamPlatformFilter')?.addEventListener('change',()=>applyStreamFilters(true));
  document.getElementById('streamPrev')?.addEventListener('click',()=>{streamPage--;renderMatchedStreams()});
  document.getElementById('streamNext')?.addEventListener('click',()=>{streamPage++;renderMatchedStreams()});
}

async function load(){
 if(!matchId){document.getElementById('titleTeam1').textContent='Match ID missing';return}
 wireStreamControls();
 try{
  const r=await fetch('/api/esports/matches/'+encodeURIComponent(matchId)+'?game='+encodeURIComponent(game));
  if(!r.ok)throw new Error(await r.text());
  const d=await r.json(),m=d.match||{},s=d.summary||{},latest=s.latest||{},peaks=s.peakByPlatform||{};
  matchData=d;
  document.title=(m.team1||'Match')+' vs '+(m.team2||'')+' · '+(m.game||game);
  const team1=m.team1||'TBD',team2=m.team2||'TBD';
  document.getElementById('titleTeam1').textContent=team1;
  document.getElementById('titleTeam2').textContent=team2;
  document.getElementById('tournament').textContent=(m.tournament||'Esports match')+' · '+(m.tier||'S/A');
  document.getElementById('time').textContent=(m.startTime?new Date(m.startTime).toLocaleString():'—')+(m.endTime?' → '+new Date(m.endTime).toLocaleString():'');
  const sourceStatus=String(m.status||'').toUpperCase();
  const live=Boolean(d.active)||sourceStatus==='LIVE';
  const statusText=live?'LIVE':(sourceStatus==='UPCOMING'?'UPCOMING':'COMPLETED');
  const status=document.getElementById('status');
  document.getElementById('statusText').textContent=statusText;
  status.className='status-pill '+(live?'live':statusText==='COMPLETED'?'completed':'');
  document.getElementById('scoreTeam1').textContent=team1;
  document.getElementById('scoreTeam2').textContent=team2;
  document.getElementById('score').textContent=(m.team1Score==null?'—':m.team1Score)+' : '+(m.team2Score==null?'—':m.team2Score);
  document.getElementById('format').textContent=m.bestOf?m.bestOf+(m.winner?' · Winner: '+m.winner:''):(m.winner?'Winner: '+m.winner:'Score not available yet');
  document.getElementById('game').textContent=m.game||game;
  document.getElementById('tier').textContent=m.tier||'—';
  document.getElementById('matchId').textContent=m.matchId||matchId;
  document.getElementById('peak').textContent=fmt(s.peakCombined);
  document.getElementById('average').textContent=fmt(s.averageCombined);
  document.getElementById('samples').textContent=fmt(s.samples);
  const ch=Object.values(s.channelsByPlatform||{}).reduce((a,b)=>a+Number(b||0),0);
  document.getElementById('channels').textContent=fmt(ch);
  document.getElementById('platformPeaks').innerHTML=['YouTube','Twitch','Kick'].map(p=>`<div class="platform"><div class="sub">${p}</div><strong>${fmt(peaks[p])}</strong></div>`).join('');
  document.getElementById('latest').innerHTML=['YouTube','Twitch','Kick','Combined'].map(p=>{const k=p.toLowerCase();return `<div class="platform"><div class="sub">${p}</div><strong>${fmt(latest[k])}</strong></div>`}).join('');
  allMatchedStreams=Array.isArray(d.streams)?d.streams:[];
  rebuildPlatformFilter();
  applyStreamFilters(true);
  await loadTeamLogos(m);
  const points=d.timeline||[],labels=points.map(x=>new Date(x.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
  new Chart(document.getElementById('trend'),{type:'line',data:{labels,datasets:[{label:'Combined',data:points.map(x=>x.combined),borderWidth:2,tension:.25,fill:true},{label:'YouTube',data:points.map(x=>x.youtube),borderWidth:1.5,tension:.25},{label:'Twitch',data:points.map(x=>x.twitch),borderWidth:1.5,tension:.25},{label:'Kick',data:points.map(x=>x.kick),borderWidth:1.5,tension:.25}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{x:{ticks:{color:'#91a0b1',maxTicksLimit:12},grid:{color:'#202b36'}},y:{beginAtZero:true,ticks:{color:'#91a0b1'},grid:{color:'#202b36'}}},plugins:{legend:{labels:{color:'#dbe4ef'}}}}});
 }catch(e){document.getElementById('titleTeam1').textContent='Unable to load match';
  document.getElementById('titleTeam2').textContent='';document.getElementById('streams').innerHTML='<div class="empty">'+esc(e.message||'Match unavailable')+'</div>';console.error(e)}
}
load();
</script></body></html>
