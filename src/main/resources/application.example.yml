spring:
  application:
    name: valorant-live-tracker
  datasource:
    url: ${TRACKER_DB_URL:jdbc:h2:file:./data/valorant-tracker}
    username: ${TRACKER_DB_USERNAME:sa}
    password: ${TRACKER_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${TRACKER_DDL_AUTO:update}

server:
  port: ${SERVER_PORT:8080}

tracker:
  enabled: true
  initial-delay-ms: ${TRACKER_INITIAL_DELAY_MS:0}
  interval-ms: ${TRACKER_INTERVAL_MS:120000}
  youtube:
    refresh-interval-ms: ${YOUTUBE_REFRESH_INTERVAL_MS:300000}
    api-key: ${YOUTUBE_API_KEY:}
    selenium:
      live-url: ${YOUTUBE_SELENIUM_LIVE_URL:https://www.youtube.com/channel/UCiMRGE8Sc6oxIGuu_JxFoHg/live}
      headless: ${YOUTUBE_SELENIUM_HEADLESS:true}
  twitch:
    client-id: ${TWITCH_CLIENT_ID:}
    client-secret: ${TWITCH_CLIENT_SECRET:}
  kick:
    client-id: ${KICK_CLIENT_ID:}
    client-secret: ${KICK_CLIENT_SECRET:}
  logging:
    slow-request-ms: ${TRACKER_SLOW_REQUEST_MS:1000}

logging:
  level:
    root: INFO
    com.valorant.tracker: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-none}] %logger{36} - %msg%n"
