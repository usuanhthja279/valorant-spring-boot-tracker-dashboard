spring:
  application:
    name: valorant-live-tracker
  datasource:
    url: ${TRACKER_DB_URL:jdbc:h2:file:./data/valorant-tracker}
    username: ${TRACKER_DB_USERNAME:sa}
    password: ${TRACKER_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${TRACKER_DDL_AUTO:update}

server:
  port: ${SERVER_PORT:8080}

tracker:
  enabled: true
  initial-delay-ms: ${TRACKER_INITIAL_DELAY_MS:0}
  interval-ms: ${TRACKER_INTERVAL_MS:120000}
  youtube:
    refresh-interval-ms: ${YOUTUBE_REFRESH_INTERVAL_MS:300000}
    api-key: ${YOUTUBE_API_KEY:}
    selenium:
      live-url: ${YOUTUBE_SELENIUM_LIVE_URL:https://www.youtube.com/channel/UCiMRGE8Sc6oxIGuu_JxFoHg/live}
      headless: ${YOUTUBE_SELENIUM_HEADLESS:true}
  twitch:
    client-id: ${TWITCH_CLIENT_ID:}
    client-secret: ${TWITCH_CLIENT_SECRET:}
  kick:
    client-id: ${KICK_CLIENT_ID:}
    client-secret: ${KICK_CLIENT_SECRET:}
  logging:
    slow-request-ms: ${TRACKER_SLOW_REQUEST_MS:1000}
discord:
        client-authentication-method: client_secret_post
        client-id: ${DISCORD_CLIENT_ID}
        client-secret: ${DISCORD_CLIENT_SECRET}
        authorization-grant-type: authorization_code
        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        scope:
          - identify
          - email
        authorization-uri: https://discord.com/oauth2/authorize
        token-uri: https://discord.com/api/oauth2/token
        user-info-uri: https://discord.com/api/users/@me
        user-name-attribute: id
twitch:
  client-authentication-method: client_secret_post
  client-id: ${TWITCH_CLIENT_ID}
  client-secret: ${TWITCH_CLIENT_SECRET}
  authorization-grant-type: authorization_code
  redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  scope:
    - user:read:email
  authorization-uri: https://id.twitch.tv/oauth2/authorize
  token-uri: https://id.twitch.tv/oauth2/token
  user-info-uri: https://api.twitch.tv/helix/users
  user-name-attribute: id
microsoft:
    client-id: ${MICROSOFT_CLIENT_ID}
    client-secret: ${MICROSOFT_CLIENT_SECRET}
    authorization-grant-type: authorization_code
    redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
    scope:
      - openid
      - profile
      - email
    provider: microsoft
provider:
    microsoft:
      issuer-uri: https://login.microsoftonline.com/common/v2.0
logging:
  level:
    root: INFO
    com.valorant.tracker: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-none}] %logger{36} - %msg%n"
